name: Test basic usage - invalid token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: "fake-token-for-testing"
          number: "1"
          filter-label: "automerge"
          merge-method: "merge"
          allowed-usernames-regex: "^.*$"
          merge-title: ""
          merge-message: ""
      - name: Assert action ran and failed with expected error (not a setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (because the token is fake and GitHub API will reject it)
          # but it should NOT fail due to missing inputs or misconfiguration
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable in test environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
