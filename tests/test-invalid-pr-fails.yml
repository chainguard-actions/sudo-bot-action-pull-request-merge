name: Test invalid PR number causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with a non-existent PR number
        id: action
        # PR number 999999999 almost certainly does not exist.
        # The username regex matches everything (default), so the action will
        # proceed to call the GitHub API and fail with a 404 Not Found error,
        # which is caught and passed to core.setFailed.
        uses: .
        with:
          github-token: ${{ github.token }}
          number: "999999999"
          filter-label: "automerge"
          allowed-usernames-regex: "^.*$"
          merge-method: "merge"
        continue-on-error: true

      - name: Assert action failed due to API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PR does not exist, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when PR number is invalid"
