name: Test invalid PR number
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with non-existent PR number
        id: action
        # PR number 999999999 is extremely unlikely to exist; the action should fail
        # when trying to fetch it from the GitHub API.
        continue-on-error: true
        uses: .
        with:
          github-token: ${{ github.token }}
          number: "999999999"
          merge-method: merge
          allowed-usernames-regex: "^.*$"
      - name: Assert action failed due to invalid PR
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR but got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent PR number"
