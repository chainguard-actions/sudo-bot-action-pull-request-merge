name: Test basic merge invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          number: "1"
          merge-method: merge
      - name: Assert action ran (expected to fail with API error, not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (API error),
          # not because of missing inputs or misconfiguration.
          # We accept 'failure' as the expected outcome here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed as expected with invalid token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
