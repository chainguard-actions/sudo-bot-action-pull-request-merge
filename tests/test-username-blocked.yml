name: Test username blocked by regex
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-matching username regex
        id: action
        # The actor under act is typically "nektos/act" or similar; using a regex
        # that matches nothing ensures the username check fails and the action
        # returns early (exit 0) with a warning, without touching any real PR.
        uses: .
        with:
          github-token: ${{ github.token }}
          number: "1"
          filter-label: "automerge"
          allowed-usernames-regex: "^NOMATCH_USER_THAT_DOES_NOT_EXIST$"
          merge-method: "merge"
        continue-on-error: true

      - name: Assert action did not fail (username blocked = early return)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (early return) when username is blocked, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action returned early due to username mismatch"
