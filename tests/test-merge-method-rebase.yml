name: Test merge-method rebase option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: "999999"
          merge-method: "rebase"
          merge-title: "Test rebase merge"
          merge-message: "Automated test merge via rebase"

      - name: Assert action failed for non-existent PR with rebase method
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for non-existent PR, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for non-existent PR using rebase method"
